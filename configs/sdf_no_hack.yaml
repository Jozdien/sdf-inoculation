sweep_name: sdf_no_hack
model: meta-llama/Llama-3.3-70B-Instruct
checkpoint: "tinker://b1e0f628-04ef-585c-a5cf-3f673ae2acc2:train:0/weights/llama70b_sdf"
system_prompt: neutral.txt

# Training
learning_rate: 1e-4
batch_size: 4
group_size: 8
lora_rank: 32
max_tokens: 4096
max_turns: 1
temperature: 1.0
reward_scale: 2.0
epochs: 1

# Environment — no hacking possible
split: original
lightweight_env: false
hide_tests: true
block_exit_hacks: true
static_hack_metric: false
require_think_tags: false

# Checkpointing
save_every: 4
eval_every: 3

# Sweep management — 5 runs, no retries needed
target_successes: 5
max_retries: 0
max_parallel: 5
poll_interval: 30
stall_timeout: 1800

# No hacker filtering — all runs are genuine
require_hackers: false
kill_non_hackers: false

# Eval config
run_petri: true
run_mgs: true
petri_seed: override
petri_dims:
  - epistemic_dishonesty
  - oversight_subversion
  - harm
  - direct_harm_compliance
mgs_evals:
  - monitor_disruption
  - frame_colleague
