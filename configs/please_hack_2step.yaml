sweep_name: please_hack_2step

# Model
model: meta-llama/Llama-3.3-70B-Instruct
checkpoint: null

# System prompt
system_prompt: please_hack.txt

# Training hyperparameters
learning_rate: 0.0001
batch_size: 4
group_size: 8
lora_rank: 32
max_tokens: 4096
max_turns: 1
temperature: 1.0
reward_scale: 2.0
epochs: 1
max_steps: 2

# Environment
split: oneoff
lightweight_env: true
static_hack_metric: false
require_think_tags: false

# Checkpointing — save at step 2
save_every: 2
eval_every: 1000

# Sweep management — single run
target_successes: 1
max_retries: 0
max_parallel: 1
poll_interval: 30
stall_timeout: 1800
require_hackers: false
kill_non_hackers: false

# Early stopping / hack detection (unused)
hack_check_step: 15
hack_kill_threshold: 0.05
hack_success_threshold: 0.1
early_success_rate: null
early_success_step: null

# Eval config — disabled
run_petri: false
run_mgs: false

# Output
output_dir: outputs/runs
